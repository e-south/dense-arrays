[project]
name = "dense-arrays"
version = "0.2.0"
description = "A library to create densely packed DNA arrays from motifs"
authors = [
    {name = "Virgile Andreani", email = "andreani@bu.edu"},
    {name = "Eric J South", email = "ericjohnsouth@gmail.com"},
]
dependencies = [
    "numpy>=1.25.2",
    "ortools>=9.7.2996",
    "rich>=13.7.0",
    "typer>=0.12.0",
]
requires-python = ">=3.12"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
playback = [
    "matplotlib>=3.8.0",
    "networkx>=3.6.1",
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.3",
    "mkdocstrings[python]>=1.0.3",
]
dev = [
    "pre-commit>=4.5.1",
    "pip-audit>=2.10.0",
    "pytest>=9.0.3",
    "ruff>=0.14.14",
]

[project.scripts]
dense-arrays = "dense_arrays.cli:app"
dense-arrays-playback = "dense_arrays.playback.cli:app"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = ["ALL"]
ignore = [
    # Commas something
    "COM812",
    # Implicitly concatenated string literals on one line
    # (does not work well with ruff format)
    "ISC001",
    # Unnecessary assignment to return
    "RET504",
    # Commented code
    "ERA001",
    # Copyright stuff
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"src/dense_arrays/playback/*.py" = [
