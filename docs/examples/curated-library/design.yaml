schema: dense_arrays.matrix.v1
base:
  schema: dense_arrays.design.v1
  parts: {pool: pool}
  length: {exact: 100}
  strands: double
  seed: 42
  limits: {attempts: 2000, active_seconds: 600, solver_seconds: 10}
  assembly:
    padding: {side: left, max_trials: 2000}
  requirements:
    - {kind: gc, id: pad_gc, scope: padding, min: 0.4, max: 0.6}
  resampling:
    schema: dense_arrays.resampling.v1
    sampling:
      policy: part_flow_priority_sha256.v1
      size: 10
      strategy: group_balanced
      seed: 42
      unique_sequences: true
      unique_cores: false
      max_per_group: null
    max_batches: 200
    attempts_per_batch: 30
    accepted_per_batch: 10
    feedback: null
    on_unproven: next_batch
axes:
  architecture:
    baseline: {}
    fixed_pair:
      add_requirements:
        - {kind: fixed, id: upstream, part_id: anchor_up, orientation: forward}
        - {kind: fixed, id: downstream, part_id: anchor_down, orientation: forward}
        - {kind: spacing, id: spacer, upstream: anchor_up, downstream: anchor_down, min: 16, max: 18}
sources:
  architecture=baseline:
    pool: pool
    select: {groups: [TF_A, TF_B, TF_C]}
allocation: {per_cell: 50}
max_cells: 2
