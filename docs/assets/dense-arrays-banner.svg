<svg width="1280" height="240" viewBox="0 0 1280 240" fill="none"
  xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Dense Arrays — motif packing</title>
  <desc id="desc">Three synthetic motifs, CAG, AGC, and CGT, share compatible
    bases in the six-base sequence CAGCGT. Their starts are 0, 1, and 3;
    aligned intervals show each placement above the resulting duplex.
    The bracket marks a six-base length limit. This is an illustrative
    arrangement, not a recorded solver trace or a biological prediction.</desc>
  <rect width="1280" height="240" rx="12" fill="#1E1D1A"/>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
      markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#969087"/>
    </marker>
  </defs>

  <g font-family="Menlo, Monaco, Consolas, monospace">
    <text x="44" y="115" fill="#F3EFE7" font-size="48" font-weight="700"
      letter-spacing="-2">dense arrays</text>
    <text x="48" y="150" fill="#969087" font-size="16"
      letter-spacing="1.5">MOTIF PACKING</text>
    <path d="M48 172H90" stroke="#D97757" stroke-width="6"/>
    <path d="M438 35V205" stroke="#3F3C37" stroke-width="2"/>

    <g data-role="input-motifs">
      <title>Input motifs in their supplied orientation</title>
      <text x="505" y="54" fill="#969087" font-size="17">MOTIFS</text>
      <g fill="#F3EFE7" font-size="29" letter-spacing="4">
        <text x="510" y="94">CAG</text>
        <text x="510" y="134">AGC</text>
        <text x="510" y="174">CGT</text>
      </g>
    </g>

    <path d="M635 121H716" stroke="#969087" stroke-width="2"
      marker-end="url(#arrow)"/>

    <g data-role="realized-placements" stroke-width="5">
      <title>CAG occupies [0, 3), AGC occupies [1, 4), and CGT occupies [3, 6)</title>
      <path d="M790 56H952" stroke="#F3EFE7"/>
      <path d="M844 78H1006" stroke="#D97757"/>
      <path d="M952 100H1114" stroke="#F3EFE7"/>
      <g fill="#969087" font-size="17" stroke="none">
        <text x="969" y="61">CAG</text>
        <text x="1023" y="83">AGC</text>
        <text x="1131" y="105">CGT</text>
      </g>
    </g>

    <g data-role="realized-duplex">
      <title>The resulting sequence and its aligned complementary strand</title>
      <path d="M790 112V173M844 90V112M952 68V112M1006 90V112M1114 112V173"
        stroke="#5A5650" stroke-width="1" stroke-dasharray="3 4"/>
      <g font-size="30" text-anchor="middle" fill="#F3EFE7">
        <text x="817" y="137">C</text>
        <text x="871" y="137" fill="#D97757">A</text>
        <text x="925" y="137" fill="#D97757">G</text>
        <text x="979" y="137" fill="#D97757">C</text>
        <text x="1033" y="137">G</text>
        <text x="1087" y="137">T</text>
        <text x="817" y="173">G</text>
        <text x="871" y="173">T</text>
        <text x="925" y="173">C</text>
        <text x="979" y="173">G</text>
        <text x="1033" y="173">C</text>
        <text x="1087" y="173">A</text>
      </g>
      <path d="M817 141V148M871 141V148M925 141V148M979 141V148M1033 141V148M1087 141V148"
        stroke="#969087" stroke-width="2"/>
    </g>

    <g data-role="length-limit">
      <title>The six-base sequence fits the six-base limit</title>
      <path d="M790 184V191H1114V184" stroke="#969087" stroke-width="2"/>
      <text x="952" y="220" text-anchor="middle" fill="#F3EFE7"
        font-size="20">6 bp limit</text>
    </g>
  </g>
</svg>
