<svg width="1280" height="240" viewBox="0 0 1280 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Dense Arrays — motif packing</title>
<desc id="desc">Four overlapping 16-base motifs fit into the 37-base sequence ACGTTGCAAGTCCTGATCGTACCGATGCTTAGGACGT. Their starts are 0, 7, 14, and 21. The aligned motifs and complementary strand show how 27 bases are shared.</desc>
  <rect width="1280" height="240" rx="12" fill="#1E1D1A"/>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4"
      markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L8 4L0 8" fill="#969087"/>
    </marker>
  </defs>

  <g font-family="Menlo, Monaco, Consolas, monospace">
    <text x="44" y="115" fill="#F3EFE7" font-size="48" font-weight="700"
      letter-spacing="-2">dense arrays</text>
    <text x="48" y="150" fill="#969087" font-size="16"
      letter-spacing="1.5">MOTIF PACKING</text>
    <path d="M48 172H90" stroke="#D97757" stroke-width="6"/>
    <path d="M438 35V205" stroke="#3F3C37" stroke-width="2"/>


<g data-role="realized-placements" font-size="24">
<text x="540" y="48" fill="#F3EFE7" textLength="272" lengthAdjust="spacingAndGlyphs">ACGTTGCAAGTCCTGA</text>
<text x="659" y="76" fill="#D97757" textLength="272" lengthAdjust="spacingAndGlyphs">AAGTCCTGATCGTACC</text>
<text x="778" y="104" fill="#A5B8A0" textLength="272" lengthAdjust="spacingAndGlyphs">GATCGTACCGATGCTT</text>
<text x="897" y="132" fill="#D5B980" textLength="272" lengthAdjust="spacingAndGlyphs">CCGATGCTTAGGACGT</text>
</g><g data-role="realized-duplex" font-size="24" fill="#F3EFE7">
<text x="540" y="172" textLength="629" lengthAdjust="spacingAndGlyphs">ACGTTGCAAGTCCTGATCGTACCGATGCTTAGGACGT</text>
<text x="540" y="202" textLength="629" lengthAdjust="spacingAndGlyphs">TGCAACGTTCAGGACTAGCATGGCTACGAATCCTGCA</text>
<path d="M540 212v5h629v-5" stroke="#969087"/>
