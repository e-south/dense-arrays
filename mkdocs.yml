site_name: Dense Arrays
site_url: https://dunloplab.gitlab.io/dense-arrays
site_dir: public
repo_url: https://github.com/e-south/dense-arrays

nav:
  - Home: index.md
  - First array: quickstart.md
  - Constraints: constraints.md
  - Playback: playback.md
  - Method: method.md
  - Reference:
      - Choose an interface: api.md
      - Optimizer: reference/optimizer.md
      - DenseArray results: reference/results.md
      - Sequence utilities: reference/sequence.md
      - Realized arrays: reference/realized.md
      - Playback API: reference/playback.md
      - Media presentation: reference/playback-presentation.md
      - Update an existing caller: migration.md
      - Command-line options: reference/cli.md
  - Architecture:
      - Module boundaries: architecture/README.md
      - Playback contract: architecture/solution-playback.md
      - Playback product brief: architecture/animation-product-spec.md
  - Contribute:
      - Development checks: development.md
      - Write documentation: development/documentation.md
      - Hardening history:
          - Baseline audit: development/audit.md
          - Completed work: development/improvement-plan.md

theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            filters:
              - '!^_'

markdown_extensions:
  - pymdownx.superfences
