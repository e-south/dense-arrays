theme:
  name: material

plugins:
  - search
  - mkdocstrings:
      custom_templates: maintenance/docs/templates
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            merge_init_into_class: true
            separate_signature: true
            filters:
              - '!^_'

markdown_extensions:
  - pymdownx.superfences
