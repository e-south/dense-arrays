image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy

cache:
  paths:
    - .cache/uv

before_script:
  - uv sync --frozen --extra dev --extra playback --extra docs

pre-commit:
  stage: test
  script:
    - uv run pre-commit run --all-files

test:
  stage: test
  script:
    - uv run pytest -v
    - uv export --frozen --all-extras --no-hashes --no-emit-project | uv run pip-audit -r /dev/stdin --progress-spinner off

pages:
  stage: deploy
  script:
    - uv run mkdocs build --strict --verbose --site-dir public
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH
